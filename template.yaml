AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  detroit-techno-archive
  A public REST API archiving the history of Detroit Techno and House music.

Globals:
  Function:
    Timeout: 10
    Runtime: python3.14
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_TABLE_ARTISTS: !Ref ArtistsTable
        DYNAMODB_TABLE_LABELS: !Ref LabelsTable
        DYNAMODB_TABLE_RELEASES: !Ref ReleasesTable
        DYNAMODB_TABLE_VENUES: !Ref VenuesTable
        DYNAMODB_TABLE_EVENTS: !Ref EventsTable
        DYNAMODB_TABLE_GEAR: !Ref GearTable
    LoggingConfig:
      LogFormat: JSON

Resources:

  # ─── DynamoDB Tables ───────────────────────────────────────────

  ArtistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-artists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: artist_id
          AttributeType: S
      KeySchema:
        - AttributeName: artist_id
          KeyType: HASH

  LabelsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-labels
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: label_id
          AttributeType: S
      KeySchema:
        - AttributeName: label_id
          KeyType: HASH

  ReleasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-releases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: release_id
          AttributeType: S
      KeySchema:
        - AttributeName: release_id
          KeyType: HASH

  VenuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-venues
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: venue_id
          AttributeType: S
      KeySchema:
        - AttributeName: venue_id
          KeyType: HASH

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH

  GearTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-gear
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gear_id
          AttributeType: S
      KeySchema:
        - AttributeName: gear_id
          KeyType: HASH

  # ─── Lambda Functions ───────────────────────────────────────────

  GetArtistsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: get_artists.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ArtistsTable
      Events:
        GetArtists:
          Type: Api
          Properties:
            Path: /artists
            Method: get

  GetArtistFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: get_artist.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ArtistsTable
      Events:
        GetArtist:
          Type: Api
          Properties:
            Path: /artists/{artist_id}
            Method: get

  GetLabelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/labels/
      Handler: get_labels.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LabelsTable
      Events:
        GetLabels:
          Type: Api
          Properties:
            Path: /labels
            Method: get

  GetLabelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/labels/
      Handler: get_label.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LabelsTable
      Events:
        GetLabel:
          Type: Api
          Properties:
            Path: /labels/{label_id}
            Method: get

  GetReleasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/releases/
      Handler: get_releases.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReleasesTable
      Events:
        GetReleases:
          Type: Api
          Properties:
            Path: /releases
            Method: get

  GetReleaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/releases/
      Handler: get_release.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReleasesTable
      Events:
        GetRelease:
          Type: Api
          Properties:
            Path: /releases/{release_id}
            Method: get

  GetVenuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/venues/
      Handler: get_venues.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VenuesTable
      Events:
        GetVenues:
          Type: Api
          Properties:
            Path: /venues
            Method: get

  GetVenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/venues/
      Handler: get_venue.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VenuesTable
      Events:
        GetVenue:
          Type: Api
          Properties:
            Path: /venues/{venue_id}
            Method: get

  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/events/
      Handler: get_events.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEvents:
          Type: Api
          Properties:
            Path: /events
            Method: get

  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/events/
      Handler: get_event.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEvent:
          Type: Api
          Properties:
            Path: /events/{event_id}
            Method: get

  GetGearListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/gear/
      Handler: get_gear_list.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GearTable
      Events:
        GetGearList:
          Type: Api
          Properties:
            Path: /gear
            Method: get

  GetGearItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/gear/
      Handler: get_gear_item.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GearTable
      Events:
        GetGearItem:
          Type: Api
          Properties:
            Path: /gear/{gear_id}
            Method: get

Outputs:
  ArtistsApi:
    Description: API Gateway endpoint for artists
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/artists"