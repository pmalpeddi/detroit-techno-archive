AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  detroit-techno-archive
  A public REST API archiving the history of Detroit Techno and House music.

Parameters:
  AlarmEmail:
    Type: String
    Description: Email address for CloudWatch alarm notifications

Globals:
  Function:
    Timeout: 10
    Runtime: python3.14
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        DYNAMODB_TABLE_ARTISTS: !Ref ArtistsTable
        DYNAMODB_TABLE_LABELS: !Ref LabelsTable
        DYNAMODB_TABLE_RELEASES: !Ref ReleasesTable
        DYNAMODB_TABLE_VENUES: !Ref VenuesTable
        DYNAMODB_TABLE_EVENTS: !Ref EventsTable
        DYNAMODB_TABLE_GEAR: !Ref GearTable
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
    Auth:
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt AdminUserPool.Arn

Resources:

  # ─── Alarm Notifications ────────────────────────────────────────
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: detroit-techno-archive-alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # ─── DynamoDB Tables ───────────────────────────────────────────

  ArtistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-artists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: artist_id
          AttributeType: S
      KeySchema:
        - AttributeName: artist_id
          KeyType: HASH

  LabelsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-labels
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: label_id
          AttributeType: S
      KeySchema:
        - AttributeName: label_id
          KeyType: HASH

  ReleasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-releases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: release_id
          AttributeType: S
      KeySchema:
        - AttributeName: release_id
          KeyType: HASH

  VenuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-venues
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: venue_id
          AttributeType: S
      KeySchema:
        - AttributeName: venue_id
          KeyType: HASH

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH

  GearTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-gear
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gear_id
          AttributeType: S
      KeySchema:
        - AttributeName: gear_id
          KeyType: HASH

  # ─── Cognito ───────────────────────────────────────────────────

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: detroit-techno-admin-pool
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: detroit-techno-admin-client
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days
      AccessTokenValidity: 24
      RefreshTokenValidity: 30

  # ─── Lambda Functions — Artists ─────────────────────────────────

  GetArtistsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: get_artists.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ArtistsTable
      Events:
        GetArtists:
          Type: Api
          Properties:
            Path: /artists
            Method: get

  GetArtistFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: get_artist.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ArtistsTable
      Events:
        GetArtist:
          Type: Api
          Properties:
            Path: /artists/{artist_id}
            Method: get

  PostArtistFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: post_artist.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArtistsTable
      Events:
        PostArtist:
          Type: Api
          Properties:
            Path: /artists
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  PutArtistFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: put_artist.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArtistsTable
      Events:
        PutArtist:
          Type: Api
          Properties:
            Path: /artists/{artist_id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer

