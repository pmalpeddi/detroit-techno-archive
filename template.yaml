AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  detroit-techno-archive
  A public REST API archiving the history of Detroit Techno and House music.

Globals:
  Function:
    Timeout: 10
    Runtime: python3.14
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_TABLE_ARTISTS: !Ref ArtistsTable
        DYNAMODB_TABLE_LABELS: !Ref LabelsTable
        DYNAMODB_TABLE_RELEASES: !Ref ReleasesTable
        DYNAMODB_TABLE_VENUES: !Ref VenuesTable
        DYNAMODB_TABLE_EVENTS: !Ref EventsTable
        DYNAMODB_TABLE_GEAR: !Ref GearTable
    LoggingConfig:
      LogFormat: JSON
  Api:
    Auth:
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt AdminUserPool.Arn

Resources:

  # ─── DynamoDB Tables ───────────────────────────────────────────

  ArtistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-artists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: artist_id
          AttributeType: S
      KeySchema:
        - AttributeName: artist_id
          KeyType: HASH

  LabelsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-labels
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: label_id
          AttributeType: S
      KeySchema:
        - AttributeName: label_id
          KeyType: HASH

  ReleasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-releases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: release_id
          AttributeType: S
      KeySchema:
        - AttributeName: release_id
          KeyType: HASH

  VenuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-venues
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: venue_id
          AttributeType: S
      KeySchema:
        - AttributeName: venue_id
          KeyType: HASH

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH

  GearTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: detroit-techno-gear
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gear_id
          AttributeType: S
      KeySchema:
        - AttributeName: gear_id
          KeyType: HASH

  # ─── Cognito ───────────────────────────────────────────────────

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: detroit-techno-admin-pool
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: detroit-techno-admin-client
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days
      AccessTokenValidity: 24
      RefreshTokenValidity: 30

  # ─── Lambda Functions — Artists ─────────────────────────────────

  GetArtistsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: get_artists.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ArtistsTable
      Events:
        GetArtists:
          Type: Api
          Properties:
            Path: /artists
            Method: get

  GetArtistFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: get_artist.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ArtistsTable
      Events:
        GetArtist:
          Type: Api
          Properties:
            Path: /artists/{artist_id}
            Method: get

  PostArtistFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: post_artist.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArtistsTable
      Events:
        PostArtist:
          Type: Api
          Properties:
            Path: /artists
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  PutArtistFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/artists/
      Handler: put_artist.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArtistsTable
      Events:
        PutArtist:
          Type: Api
          Properties:
            Path: /artists/{artist_id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer

  # ─── Lambda Functions — Labels ──────────────────────────────────

  GetLabelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/labels/
      Handler: get_labels.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LabelsTable
      Events:
        GetLabels:
          Type: Api
          Properties:
            Path: /labels
            Method: get

  GetLabelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/labels/
      Handler: get_label.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LabelsTable
      Events:
        GetLabel:
          Type: Api
          Properties:
            Path: /labels/{label_id}
            Method: get

  PostLabelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/labels/
      Handler: post_label.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LabelsTable
      Events:
        PostLabel:
          Type: Api
          Properties:
            Path: /labels
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  PutLabelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/labels/
      Handler: put_label.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LabelsTable
      Events:
        PutLabel:
          Type: Api
          Properties:
            Path: /labels/{label_id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer

  # ─── Lambda Functions — Releases ────────────────────────────────

  GetReleasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/releases/
      Handler: get_releases.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReleasesTable
      Events:
        GetReleases:
          Type: Api
          Properties:
            Path: /releases
            Method: get

  GetReleaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/releases/
      Handler: get_release.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReleasesTable
      Events:
        GetRelease:
          Type: Api
          Properties:
            Path: /releases/{release_id}
            Method: get

  PostReleaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/releases/
      Handler: post_release.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReleasesTable
      Events:
        PostRelease:
          Type: Api
          Properties:
            Path: /releases
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  PutReleaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/releases/
      Handler: put_release.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReleasesTable
      Events:
        PutRelease:
          Type: Api
          Properties:
            Path: /releases/{release_id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer

  # ─── Lambda Functions — Venues ──────────────────────────────────

  GetVenuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/venues/
      Handler: get_venues.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VenuesTable
      Events:
        GetVenues:
          Type: Api
          Properties:
            Path: /venues
            Method: get

  GetVenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/venues/
      Handler: get_venue.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VenuesTable
      Events:
        GetVenue:
          Type: Api
          Properties:
            Path: /venues/{venue_id}
            Method: get

  PostVenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/venues/
      Handler: post_venue.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VenuesTable
      Events:
        PostVenue:
          Type: Api
          Properties:
            Path: /venues
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  PutVenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/venues/
      Handler: put_venue.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VenuesTable
      Events:
        PutVenue:
          Type: Api
          Properties:
            Path: /venues/{venue_id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer

  # ─── Lambda Functions — Events ──────────────────────────────────

  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/events/
      Handler: get_events.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEvents:
          Type: Api
          Properties:
            Path: /events
            Method: get

  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/events/
      Handler: get_event.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEvent:
          Type: Api
          Properties:
            Path: /events/{event_id}
            Method: get

  PostEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/events/
      Handler: post_event.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        PostEvent:
          Type: Api
          Properties:
            Path: /events
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  PutEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/events/
      Handler: put_event.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        PutEvent:
          Type: Api
          Properties:
            Path: /events/{event_id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer

  # ─── Lambda Functions — Gear ────────────────────────────────────

  GetGearListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/gear/
      Handler: get_gear_list.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GearTable
      Events:
        GetGearList:
          Type: Api
          Properties:
            Path: /gear
            Method: get

  GetGearItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/gear/
      Handler: get_gear_item.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GearTable
      Events:
        GetGearItem:
          Type: Api
          Properties:
            Path: /gear/{gear_id}
            Method: get

  PostGearFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/gear/
      Handler: post_gear.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GearTable
      Events:
        PostGear:
          Type: Api
          Properties:
            Path: /gear
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  PutGearFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/gear/
      Handler: put_gear.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GearTable
      Events:
        PutGear:
          Type: Api
          Properties:
            Path: /gear/{gear_id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  ArtistsApi:
    Description: API Gateway endpoint for artists
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/artists"

  UserPoolClient:
    Description: Cognito User Pool ID
    Value: !Ref AdminUserPool

  UserPoolCLientId:
    Description: Cognito User Pool Client ID
    Value: !Ref AdminUserPoolClient